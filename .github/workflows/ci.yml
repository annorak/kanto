# =============================================================================
# Kanto CI — lint and test
# =============================================================================
#
# The `lint` job is functional from day one — it runs the same
# pre-commit hooks every contributor uses locally. The `test` job is a
# placeholder; it is replaced by the real pytest invocation when the
# first workspace package lands.
#
# Triggers: every PR, and every push to main.
# =============================================================================

name: ci

on:
  push:
    branches: [main]
  pull_request:
    branches: [main]

# Cancel in-flight runs of the same workflow on the same ref. Saves CI
# minutes and produces a single up-to-date status check per PR head.
concurrency:
  group: ci-${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: true

permissions:
  contents: read

jobs:
  lint:
    name: lint (pre-commit)
    runs-on: ubuntu-latest
    timeout-minutes: 10
    steps:
      - name: Check out repository
        uses: actions/checkout@v4
        with:
          # Full history needed so pre-commit's gitleaks hook (when run
          # with --all-files locally) and check-merge-conflict behave
          # identically to developer machines.
          fetch-depth: 0

      - name: Set up Python 3.12
        uses: actions/setup-python@v5
        with:
          python-version: "3.12"

      - name: Install uv
        uses: astral-sh/setup-uv@v3
        with:
          enable-cache: true
          # uv.lock is intentionally not committed (.gitignore documents why).
          # setup-uv's default cache-dependency-glob is **/uv.lock and errors
          # when nothing matches. Key the cache off the dependency manifests
          # we actually commit — pyproject.toml in the workspace and packages.
          cache-dependency-glob: "**/pyproject.toml"

      - name: Sync workspace
        # --all-packages installs every workspace member's deps so the mypy
        # pre-commit hook can resolve pydantic / opentelemetry / etc. against
        # libs/kanto-commons. Mirrors what the test jobs below already do.
        run: uv sync --all-packages --group dev

      - name: Install gitleaks
        # Pre-commit's gitleaks hook is `language: system`, so the binary
        # must be on PATH before `pre-commit run`. Pinned version: bump
        # deliberately, never track latest.
        env:
          GITLEAKS_VERSION: "8.30.1"
        run: |
          set -euo pipefail
          curl -fsSL \
            "https://github.com/gitleaks/gitleaks/releases/download/v${GITLEAKS_VERSION}/gitleaks_${GITLEAKS_VERSION}_linux_x64.tar.gz" \
            | sudo tar -xz -C /usr/local/bin gitleaks
          sudo chmod +x /usr/local/bin/gitleaks
          gitleaks version

      - name: Cache pre-commit hooks
        uses: actions/cache@v4
        with:
          path: ~/.cache/pre-commit
          key: pre-commit-${{ runner.os }}-${{ hashFiles('.pre-commit-config.yaml') }}

      - name: Run pre-commit on all files
        run: uv run pre-commit run --all-files --show-diff-on-failure

  test-kanto-commons:
    name: test (kanto-commons)
    runs-on: ubuntu-latest
    timeout-minutes: 15
    steps:
      - name: Check out repository
        uses: actions/checkout@v4

      - name: Set up Python 3.12
        uses: actions/setup-python@v5
        with:
          python-version: "3.12"

      - name: Install uv
        uses: astral-sh/setup-uv@v3
        with:
          enable-cache: true
          # uv.lock is intentionally not committed (.gitignore documents why).
          # setup-uv's default cache-dependency-glob is **/uv.lock and errors
          # when nothing matches. Key the cache off the dependency manifests
          # we actually commit — pyproject.toml in the workspace and packages.
          cache-dependency-glob: "**/pyproject.toml"

      - name: Sync workspace
        run: uv sync --all-packages --group dev

      - name: Run unit tests
        working-directory: libs/kanto-commons
        run: uv run pytest tests/unit/ -p no:cacheprovider

      - name: Run integration tests (testcontainers)
        working-directory: libs/kanto-commons
        run: uv run pytest tests/integration/ -m integration -p no:cacheprovider --no-cov

  test-growlithe:
    name: test (growlithe)
    runs-on: ubuntu-latest
    timeout-minutes: 15
    steps:
      - name: Check out repository
        uses: actions/checkout@v4

      - name: Set up Python 3.12
        uses: actions/setup-python@v5
        with:
          python-version: "3.12"

      - name: Install uv
        uses: astral-sh/setup-uv@v3
        with:
          enable-cache: true
          cache-dependency-glob: "**/pyproject.toml"

      - name: Sync workspace
        run: uv sync --all-packages --group dev

      - name: Run unit tests with coverage gate
        # The growlithe pyproject sets fail_under=80; the gate fails the
        # job if coverage drops below that. service.py is excluded from
        # coverage (integration-only glue, exercised by the live smoke
        # test on the operator's laptop after deployment).
        working-directory: services/growlithe
        run: uv run pytest tests/unit/ -p no:cacheprovider --cov=growlithe --cov-report=term-missing

      - name: Run integration tests (testcontainers)
        # Integration suite uses kanto_commons.testing.mew_pool to spin
        # up pgvector/pgvector:pg16 via Docker; pulled from Docker Hub.
        working-directory: services/growlithe
        run: uv run pytest tests/integration/ -m integration -p no:cacheprovider --no-cov

  test-snorlax:
    name: test (snorlax)
    runs-on: ubuntu-latest
    timeout-minutes: 25
    steps:
      - name: Check out repository
        uses: actions/checkout@v4

      - name: Set up Python 3.12
        uses: actions/setup-python@v5
        with:
          python-version: "3.12"

      - name: Install uv
        uses: astral-sh/setup-uv@v3
        with:
          enable-cache: true
          cache-dependency-glob: "**/pyproject.toml"

      - name: Sync workspace
        run: uv sync --all-packages --group dev

      - name: Install Prodigal
        # Prodigal 2.6.3 is the version baked into the Snorlax container
        # image; the real-Prodigal sanity test and the kanto-snorlax
        # smoke-test path both invoke ``prodigal`` from $PATH so the
        # runner needs the binary too. Bioconda ships the canonical
        # build, but here we just apt-install since Ubuntu's package
        # tracks 2.6.3 exactly.
        run: |
          set -euo pipefail
          sudo apt-get update
          sudo apt-get install -y --no-install-recommends prodigal
          prodigal -v

      - name: Run unit tests with coverage gate
        # Snorlax pyproject sets fail_under=80; the gate fails the job
        # if coverage drops below that. service.py is excluded — the
        # signal-handler / aiohttp-server wiring is exercised end-to-end
        # by the live smoke test, not by isolated unit tests.
        working-directory: services/snorlax
        run: uv run pytest tests/unit/ -p no:cacheprovider --cov=snorlax --cov-report=term-missing

      - name: Run integration tests (testcontainers)
        # Integration suite uses kanto_commons.testing.mew_pool to spin
        # up pgvector/pgvector:pg16 via Docker; pulled from Docker Hub.
        working-directory: services/snorlax
        run: uv run pytest tests/integration/ -m integration -p no:cacheprovider --no-cov

      - name: Run real-NCBI smoke test
        # Hits ftp.ncbi.nlm.nih.gov over HTTPS and runs Prodigal on the
        # downloaded genome. The Modal portion is mocked until Task 7
        # ships Ditto; this still validates download + Prodigal + OS
        # upload end-to-end against the live source.
        working-directory: services/snorlax
        run: uv run pytest tests/integration/test_real_ncbi_smoke.py -m real_ncbi -p no:cacheprovider --no-cov

  test-ditto:
    name: test (ditto)
    runs-on: ubuntu-latest
    timeout-minutes: 15
    steps:
      - name: Check out repository
        uses: actions/checkout@v4

      - name: Set up Python 3.12
        uses: actions/setup-python@v5
        with:
          python-version: "3.12"

      - name: Install uv
        uses: astral-sh/setup-uv@v3
        with:
          enable-cache: true
          cache-dependency-glob: "**/pyproject.toml"

      - name: Sync workspace
        # ditto declares torch + esm as optional extras (see
        # services/ditto/pyproject.toml). Modal builds the image with
        # those at deploy time; CI exercises pipeline + batching +
        # aggregate + parquet + cost-monitor with fakes so neither is
        # needed here.
        run: uv sync --all-packages --group dev

      - name: Run unit tests with coverage gate
        # ditto pyproject sets fail_under=75 (lower than other services
        # because GPU code is integration-tested, not unit-tested).
        working-directory: services/ditto
        run: uv run pytest tests/unit/ -p no:cacheprovider --cov=ditto --cov-report=term-missing

      - name: Run synthetic in-process benchmark
        # Runs the parse + batch + aggregate + parquet path end-to-end
        # on a synthetic 3,000-protein proteome with a fake embedder.
        # Asserts the length-grouped batching efficiency target plus
        # per-stage wall-time bounds, so a regression in any of those
        # stages fails the job.
        working-directory: services/ditto
        run: uv run pytest tests/integration/test_synthetic_benchmark.py -m slow -p no:cacheprovider --no-cov

  test-migrations:
    name: test (migrations)
    runs-on: ubuntu-latest
    timeout-minutes: 15
    # Coverage gate is enforced at 90% inside the migrations pyproject.
    # The job runs on every PR — schema changes are review-gated and we
    # want CI to catch up/down regressions before merge.
    steps:
      - name: Check out repository
        uses: actions/checkout@v4

      - name: Set up Python 3.12
        uses: actions/setup-python@v5
        with:
          python-version: "3.12"

      - name: Install uv
        uses: astral-sh/setup-uv@v3
        with:
          enable-cache: true
          # uv.lock is intentionally not committed (.gitignore documents why).
          # setup-uv's default cache-dependency-glob is **/uv.lock and errors
          # when nothing matches. Key the cache off the dependency manifests
          # we actually commit — pyproject.toml in the workspace and packages.
          cache-dependency-glob: "**/pyproject.toml"

      - name: Sync workspace
        run: uv sync --all-packages --group dev

      - name: Run migration test suite
        working-directory: infrastructure/migrations
        run: uv run pytest tests/ -p no:cacheprovider

      - name: Run safety scanner
        # Warning-only — flagged migrations stay on the PR for the
        # reviewer to assess. Never blocks the job.
        working-directory: infrastructure/migrations
        run: uv run python -m kanto_migrations.safety
