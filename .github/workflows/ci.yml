# =============================================================================
# Kanto CI — lint and test
# =============================================================================
#
# The `lint` job is functional from day one — it runs the same
# pre-commit hooks every contributor uses locally. The `test` job is a
# placeholder; it is replaced by the real pytest invocation when the
# first workspace package lands.
#
# Triggers: every PR, and every push to main.
# =============================================================================

name: ci

on:
  push:
    branches: [main]
  pull_request:
    branches: [main]

# Cancel in-flight runs of the same workflow on the same ref. Saves CI
# minutes and produces a single up-to-date status check per PR head.
concurrency:
  group: ci-${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: true

permissions:
  contents: read

jobs:
  lint:
    name: lint (pre-commit)
    runs-on: ubuntu-latest
    timeout-minutes: 10
    steps:
      - name: Check out repository
        uses: actions/checkout@v4
        with:
          # Full history needed so pre-commit's gitleaks hook (when run
          # with --all-files locally) and check-merge-conflict behave
          # identically to developer machines.
          fetch-depth: 0

      - name: Set up Python 3.12
        uses: actions/setup-python@v5
        with:
          python-version: "3.12"

      - name: Install uv
        uses: astral-sh/setup-uv@v3
        with:
          # uv.lock is intentionally not committed (.gitignore documents why),
          # so we don't pass cache-dependency-glob — setup-uv would error if
          # the glob matched nothing. Caching still applies to the uv tool
          # itself; package resolution runs fresh each CI run.
          enable-cache: true

      - name: Sync dev tooling
        run: uv sync --group dev

      - name: Cache pre-commit hooks
        uses: actions/cache@v4
        with:
          path: ~/.cache/pre-commit
          key: pre-commit-${{ runner.os }}-${{ hashFiles('.pre-commit-config.yaml') }}

      - name: Run pre-commit on all files
        run: uv run pre-commit run --all-files --show-diff-on-failure

  test-kanto-common:
    name: test (kanto-common)
    runs-on: ubuntu-latest
    timeout-minutes: 15
    steps:
      - name: Check out repository
        uses: actions/checkout@v4

      - name: Set up Python 3.12
        uses: actions/setup-python@v5
        with:
          python-version: "3.12"

      - name: Install uv
        uses: astral-sh/setup-uv@v3
        with:
          # uv.lock is intentionally not committed (.gitignore documents why),
          # so we don't pass cache-dependency-glob — setup-uv would error if
          # the glob matched nothing. Caching still applies to the uv tool
          # itself; package resolution runs fresh each CI run.
          enable-cache: true

      - name: Sync workspace
        run: uv sync --all-packages --group dev

      - name: Run unit tests
        working-directory: libs/kanto-common
        run: uv run pytest tests/unit/ -p no:cacheprovider

      - name: Run integration tests (testcontainers)
        working-directory: libs/kanto-common
        run: uv run pytest tests/integration/ -m integration -p no:cacheprovider --no-cov

  test-migrations:
    name: test (migrations)
    runs-on: ubuntu-latest
    timeout-minutes: 15
    # Coverage gate is enforced at 90% inside the migrations pyproject.
    # The job runs on every PR — schema changes are review-gated and we
    # want CI to catch up/down regressions before merge.
    steps:
      - name: Check out repository
        uses: actions/checkout@v4

      - name: Set up Python 3.12
        uses: actions/setup-python@v5
        with:
          python-version: "3.12"

      - name: Install uv
        uses: astral-sh/setup-uv@v3
        with:
          # uv.lock is intentionally not committed (.gitignore documents why),
          # so we don't pass cache-dependency-glob — setup-uv would error if
          # the glob matched nothing. Caching still applies to the uv tool
          # itself; package resolution runs fresh each CI run.
          enable-cache: true

      - name: Sync workspace
        run: uv sync --all-packages --group dev

      - name: Run migration test suite
        working-directory: infrastructure/migrations
        run: uv run pytest tests/ -p no:cacheprovider

      - name: Run safety scanner
        # Warning-only — flagged migrations stay on the PR for the
        # reviewer to assess. Never blocks the job.
        working-directory: infrastructure/migrations
        run: uv run python -m kanto_migrations.safety
