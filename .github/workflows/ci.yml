# =============================================================================
# Kanto CI — lint and test
# =============================================================================
#
# The `lint` job is functional from day one — it runs the same
# pre-commit hooks every contributor uses locally. The `test` job is a
# placeholder; it is replaced by the real pytest invocation when the
# first workspace package lands.
#
# Triggers: every PR, and every push to main.
# =============================================================================

name: ci

on:
  push:
    branches: [main]
  pull_request:
    branches: [main]

# Cancel in-flight runs of the same workflow on the same ref. Saves CI
# minutes and produces a single up-to-date status check per PR head.
concurrency:
  group: ci-${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: true

permissions:
  contents: read

jobs:
  lint:
    name: lint (pre-commit)
    runs-on: ubuntu-latest
    timeout-minutes: 10
    steps:
      - name: Check out repository
        uses: actions/checkout@v4
        with:
          # Full history needed so pre-commit's gitleaks hook (when run
          # with --all-files locally) and check-merge-conflict behave
          # identically to developer machines.
          fetch-depth: 0

      - name: Set up Python 3.12
        uses: actions/setup-python@v5
        with:
          python-version: "3.12"

      - name: Install uv
        uses: astral-sh/setup-uv@v3
        with:
          enable-cache: true
          # uv.lock is intentionally not committed (.gitignore documents why).
          # setup-uv's default cache-dependency-glob is **/uv.lock and errors
          # when nothing matches. Key the cache off the dependency manifests
          # we actually commit — pyproject.toml in the workspace and packages.
          cache-dependency-glob: "**/pyproject.toml"

      - name: Sync workspace
        # --all-packages installs every workspace member's deps so the mypy
        # pre-commit hook can resolve pydantic / opentelemetry / etc. against
        # libs/kanto-commons. Mirrors what the test jobs below already do.
        run: uv sync --all-packages --group dev

      - name: Install gitleaks
        # Pre-commit's gitleaks hook is `language: system`, so the binary
        # must be on PATH before `pre-commit run`. Pinned version: bump
        # deliberately, never track latest.
        env:
          GITLEAKS_VERSION: "8.30.1"
        run: |
          set -euo pipefail
          curl -fsSL \
            "https://github.com/gitleaks/gitleaks/releases/download/v${GITLEAKS_VERSION}/gitleaks_${GITLEAKS_VERSION}_linux_x64.tar.gz" \
            | sudo tar -xz -C /usr/local/bin gitleaks
          sudo chmod +x /usr/local/bin/gitleaks
          gitleaks version

      - name: Cache pre-commit hooks
        uses: actions/cache@v4
        with:
          path: ~/.cache/pre-commit
          key: pre-commit-${{ runner.os }}-${{ hashFiles('.pre-commit-config.yaml') }}

      - name: Run pre-commit on all files
        run: uv run pre-commit run --all-files --show-diff-on-failure

  test-kanto-commons:
    name: test (kanto-commons)
    runs-on: ubuntu-latest
    timeout-minutes: 15
    steps:
      - name: Check out repository
        uses: actions/checkout@v4

      - name: Set up Python 3.12
        uses: actions/setup-python@v5
        with:
          python-version: "3.12"

      - name: Install uv
        uses: astral-sh/setup-uv@v3
        with:
          enable-cache: true
          # uv.lock is intentionally not committed (.gitignore documents why).
          # setup-uv's default cache-dependency-glob is **/uv.lock and errors
          # when nothing matches. Key the cache off the dependency manifests
          # we actually commit — pyproject.toml in the workspace and packages.
          cache-dependency-glob: "**/pyproject.toml"

      - name: Sync workspace
        run: uv sync --all-packages --group dev

      - name: Run unit tests
        working-directory: libs/kanto-commons
        run: uv run pytest tests/unit/ -p no:cacheprovider

      - name: Run integration tests (testcontainers)
        working-directory: libs/kanto-commons
        run: uv run pytest tests/integration/ -m integration -p no:cacheprovider --no-cov

  test-migrations:
    name: test (migrations)
    runs-on: ubuntu-latest
    timeout-minutes: 15
    # Coverage gate is enforced at 90% inside the migrations pyproject.
    # The job runs on every PR — schema changes are review-gated and we
    # want CI to catch up/down regressions before merge.
    steps:
      - name: Check out repository
        uses: actions/checkout@v4

      - name: Set up Python 3.12
        uses: actions/setup-python@v5
        with:
          python-version: "3.12"

      - name: Install uv
        uses: astral-sh/setup-uv@v3
        with:
          enable-cache: true
          # uv.lock is intentionally not committed (.gitignore documents why).
          # setup-uv's default cache-dependency-glob is **/uv.lock and errors
          # when nothing matches. Key the cache off the dependency manifests
          # we actually commit — pyproject.toml in the workspace and packages.
          cache-dependency-glob: "**/pyproject.toml"

      - name: Sync workspace
        run: uv sync --all-packages --group dev

      - name: Run migration test suite
        working-directory: infrastructure/migrations
        run: uv run pytest tests/ -p no:cacheprovider

      - name: Run safety scanner
        # Warning-only — flagged migrations stay on the PR for the
        # reviewer to assess. Never blocks the job.
        working-directory: infrastructure/migrations
        run: uv run python -m kanto_migrations.safety
