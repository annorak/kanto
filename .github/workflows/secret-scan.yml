# =============================================================================
# Kanto secret-scan — gitleaks on every PR and push to main
# =============================================================================
#
# Companion to the pre-commit hook. The pre-commit hook scans staged
# files for fast feedback; this workflow scans the full diff in CI so a
# missing local install or a `--no-verify` commit cannot bypass the
# guardrail. A failure here blocks merge.
#
# If a secret is detected:
#   1. Treat the credential as compromised — rotate it immediately.
#   2. Scrub it from history with BFG or git filter-repo (see SECURITY.md).
#   3. Force-push the scrubbed history.
#   4. Notify the team.
# =============================================================================

name: secret-scan

on:
  push:
    branches: [main]
  pull_request:
    branches: [main]

concurrency:
  group: secret-scan-${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: true

permissions:
  contents: read
  # Allow gitleaks to report findings in PR check output.
  pull-requests: read

jobs:
  gitleaks:
    name: gitleaks
    runs-on: ubuntu-latest
    timeout-minutes: 10
    steps:
      - name: Check out repository
        uses: actions/checkout@v4
        with:
          # Full history is required so gitleaks can scan the entire diff
          # being introduced (including blame information for any finding).
          fetch-depth: 0

      - name: Run gitleaks
        uses: gitleaks/gitleaks-action@v2
        env:
          # Repository-level config is picked up automatically.
          GITLEAKS_CONFIG: ${{ github.workspace }}/.gitleaks.toml
          # GITHUB_TOKEN is required for the action to post status checks.
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}
          # No license key is configured. The Action runs in the
          # rate-limited "free for public repos" mode; if Kanto becomes
          # private and the rate limit becomes an issue, set
          # GITLEAKS_LICENSE in the repo secrets.
