# =============================================================================
# kanto-commons — shared Python library for all Kanto services
# =============================================================================
#
# Package name on PyPI-style metadata: kanto-commons
# Import name in Python source: kanto_commons
#
# Every service under services/* depends on this package via the uv
# workspace. Adding new shared abstractions here is the right move when
# the same code would otherwise be duplicated across services.
# =============================================================================

[project]
name = "kanto-commons"
# Bumped to 0.2.0 alongside Task 3: the testing-fixture pool now
# registers the pgvector adapter so embedding reads round-trip
# correctly. Service consumers of ``MewClient.from_settings`` are
# unaffected (it already wired the adapter); only the
# ``mew_pool`` test fixture changed.
version = "0.2.0"
description = "Shared schemas, clients, and observability primitives for Kanto services"
readme = "README.md"
requires-python = ">=3.12,<3.13"
license = { text = "Proprietary" }
authors = [{ name = "Varun Viswanathan" }]

dependencies = [
    # Schemas + config
    "pydantic>=2.9,<3",
    "pydantic-settings>=2.6,<3",

    # Database (Mew)
    "psycopg[binary,pool]>=3.2,<4",
    "pgvector>=0.3.6,<0.4",

    # Streaming (OCI Streaming via Kafka API)
    "aiokafka>=0.12,<0.13",

    # Object Storage (OCI)
    # Pinned to a recent stable 2.x release. The OCI SDK adds new services
    # frequently but the Object Storage and Streaming surfaces we use are
    # extremely stable, so a tight upper bound is safe.
    "oci>=2.140,<3",

    # Retry — used by every client wrapper for transient-failure backoff.
    "tenacity>=9.0,<10",

    # Observability
    "structlog>=24.4,<25",
    "opentelemetry-api>=1.30,<2",
    "opentelemetry-sdk>=1.30,<2",
    "opentelemetry-exporter-otlp-proto-http>=1.30,<2",
]

[dependency-groups]
dev = [
    "pytest>=8.3.0",
    "pytest-asyncio>=0.24.0",
    "pytest-cov>=5.0.0",
    "testcontainers[postgres]>=4.8.0",
    "mypy>=1.13.0",
    "types-protobuf",
    # Used by the testcontainers fixture to apply migrations via
    # ``alembic upgrade head`` instead of a hand-rolled DDL bootstrap.
    "kanto-migrations",
]

[tool.uv.sources]
kanto-migrations = { workspace = true }

[build-system]
requires = ["hatchling"]
build-backend = "hatchling.build"

[tool.hatch.build.targets.wheel]
packages = ["src/kanto_commons"]
# Ensure the py.typed marker ships in the wheel so type checkers
# treat kanto-commons's public API as typed.
include = ["src/kanto_commons/py.typed"]

# -----------------------------------------------------------------------------
# pytest — package-local overrides on top of the repo-root config.
# -----------------------------------------------------------------------------

[tool.pytest.ini_options]
asyncio_mode = "auto"
testpaths = ["tests"]
markers = [
    "integration: tests that require external services (Docker, etc.)",
    "slow: tests that take more than a few seconds",
]

# -----------------------------------------------------------------------------
# ruff — package-local overrides on top of the repo-root config.
# -----------------------------------------------------------------------------

[tool.ruff.lint.per-file-ignores]
# Factories use dict(...) constructors on purpose so kwargs override
# defaults via dict.update(). Rewriting as literals would force a
# different (uglier) merge pattern.
"src/kanto_commons/testing/factories.py" = ["C408"]
"tests/**/*.py" = ["C408", "E501"]

# -----------------------------------------------------------------------------
# coverage — enforce the 85% bar from Task 1.
# -----------------------------------------------------------------------------

[tool.coverage.run]
branch = true
source = ["kanto_commons"]
omit = [
    "*/tests/*",
    "*/__main__.py",
    # The Postgres testcontainer fixture is exercised exclusively by
    # the integration suite, which requires Docker. Excluded here so
    # the package coverage gate doesn't penalize contributors running
    # without Docker locally.
    "*/kanto_commons/testing/mew_fixture.py",
]

[tool.coverage.report]
show_missing = true
fail_under = 85
exclude_lines = [
    "pragma: no cover",
    "raise NotImplementedError",
    "if TYPE_CHECKING:",
    "\\.\\.\\.",
]

# -----------------------------------------------------------------------------
# mypy — strict mode, plus stub overrides for libraries without types.
# -----------------------------------------------------------------------------

[tool.mypy]
python_version = "3.12"
strict = true
warn_unused_configs = true
warn_unused_ignores = true
warn_return_any = true
warn_unreachable = true
disallow_untyped_defs = true
disallow_incomplete_defs = true
no_implicit_optional = true
check_untyped_defs = true
strict_equality = true
extra_checks = true
show_error_codes = true
pretty = true
files = ["src/kanto_commons"]

# Third-party packages without bundled type stubs. We don't want service
# authors to fight mypy errors that originate inside vendor code.
[[tool.mypy.overrides]]
module = [
    "oci.*",
    "aiokafka.*",
    "pgvector.*",
    "testcontainers.*",
]
ignore_missing_imports = true
