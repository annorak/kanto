# =============================================================================
# snorlax — the Ingester + Gene Predictor service.
# =============================================================================
#
# Consumes IsolateDiscovered events from kanto.discovered, downloads the genome
# FASTA from NCBI, runs Prodigal in-pod to predict proteins, uploads the
# protein FASTA to Azure Blob Storage, and spawns Modal's Ditto function with
# the OS key. Failure handling per task-06 §7.
# =============================================================================

[project]
name = "snorlax"
version = "0.1.0"
description = "Kanto Ingester: downloads NCBI FASTAs, runs Prodigal, hands off to Ditto on Modal"
readme = "README.md"
requires-python = ">=3.12,<3.13"
license = { text = "Proprietary" }
authors = [{ name = "Varun Viswanathan" }]

dependencies = [
    "kanto-commons",

    # NCBI publishes over plain HTTPS; httpx streams responses and gives
    # us per-request timeouts plus connection pooling. We don't pull a
    # full FTP client — HTTPS is the production path documented in
    # the design doc §6.1/§6.2.
    "httpx>=0.28,<0.29",

    # Health probes. Same minimal choice as growlithe: not worth a full
    # ASGI framework for /healthz + /readyz.
    "aiohttp>=3.10,<4",

    # Retry helper for download/upload/spawn transient failures.
    "tenacity>=9.0,<10",
]

[dependency-groups]
dev = [
    "pytest>=8.3.0",
    "pytest-asyncio>=0.24.0",
    "pytest-cov>=5.0.0",
    "testcontainers[postgres]>=4.8.0",
    "respx>=0.21.1",
    "mypy>=1.13.0",
    "kanto-migrations",
]

[tool.uv.sources]
kanto-commons = { workspace = true }
kanto-migrations = { workspace = true }

[build-system]
requires = ["hatchling"]
build-backend = "hatchling.build"

[tool.hatch.build.targets.wheel]
packages = ["src/snorlax"]

[project.scripts]
snorlax = "snorlax.__main__:main"

# -----------------------------------------------------------------------------
# pytest
# -----------------------------------------------------------------------------

[tool.pytest.ini_options]
asyncio_mode = "auto"
testpaths = ["tests"]
markers = [
    "integration: tests that require external services (Docker, etc.)",
    "slow: tests that take more than a few seconds",
    "real_ncbi: smoke tests that hit the real NCBI FTP/HTTPS endpoint",
    "real_prodigal: tests that invoke a real Prodigal binary on $PATH",
]

# -----------------------------------------------------------------------------
# coverage — 80% per task-06 §12.
# -----------------------------------------------------------------------------

[tool.coverage.run]
branch = true
source = ["snorlax"]
omit = [
    "*/tests/*",
    "*/__main__.py",
    # service.py wires signal handlers and the aiohttp health server.
    # Exercised by the integration tests end-to-end; isolated coverage
    # would only mock the wiring.
    "*/snorlax/service.py",
]

[tool.coverage.report]
show_missing = true
fail_under = 80
exclude_lines = [
    "pragma: no cover",
    "raise NotImplementedError",
    "if TYPE_CHECKING:",
    "\\.\\.\\.",
]

# -----------------------------------------------------------------------------
# mypy — strict, matching kanto-commons + growlithe.
# -----------------------------------------------------------------------------

[tool.mypy]
python_version = "3.12"
strict = true
warn_unused_configs = true
warn_unused_ignores = true
warn_return_any = true
warn_unreachable = true
disallow_untyped_defs = true
disallow_incomplete_defs = true
no_implicit_optional = true
check_untyped_defs = true
strict_equality = true
extra_checks = true
show_error_codes = true
pretty = true
files = ["src/snorlax"]

[[tool.mypy.overrides]]
module = ["respx.*", "aiohttp.*", "modal.*"]
ignore_missing_imports = true
