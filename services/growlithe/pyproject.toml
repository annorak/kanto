# =============================================================================
# growlithe — the Discoverer service.
# =============================================================================
#
# Polls NCBI Pathogen Detection (v1; ENA, GISAID, customer submissions in v2)
# on a schedule and emits one IsolateDiscovered event per new isolate to
# kanto.discovered on Azure Event Hubs.
# =============================================================================

[project]
name = "growlithe"
version = "0.1.0"
description = "Kanto Discoverer: polls NCBI Pathogen Detection and emits IsolateDiscovered events"
readme = "README.md"
requires-python = ">=3.12,<3.13"
license = { text = "Proprietary" }
authors = [{ name = "Varun Viswanathan" }]

dependencies = [
    "kanto-commons",

    # NCBI is served over plain HTTPS; httpx gives us connection pooling
    # and a clean async story even though we drive polls synchronously.
    "httpx>=0.28,<0.29",

    # Health/metrics endpoints. We don't want a full ASGI framework just
    # for /healthz and /metrics; the stdlib http.server is enough but
    # awkward to wire into asyncio, so use aiohttp for the small surface.
    "aiohttp>=3.10,<4",

    # Retry helper for FTP/HTTPS transient failures.
    "tenacity>=9.0,<10",
]

[dependency-groups]
dev = [
    "pytest>=8.3.0",
    "pytest-asyncio>=0.24.0",
    "pytest-cov>=5.0.0",
    "testcontainers[postgres]>=4.8.0",
    "respx>=0.21.1",
    "mypy>=1.13.0",
    "kanto-migrations",
]

[tool.uv.sources]
kanto-commons = { workspace = true }
kanto-migrations = { workspace = true }

[build-system]
requires = ["hatchling"]
build-backend = "hatchling.build"

[tool.hatch.build.targets.wheel]
packages = ["src/growlithe"]

[project.scripts]
growlithe = "growlithe.__main__:main"

# -----------------------------------------------------------------------------
# pytest
# -----------------------------------------------------------------------------

[tool.pytest.ini_options]
asyncio_mode = "auto"
testpaths = ["tests"]
markers = [
    "integration: tests that require external services (Docker, etc.)",
    "slow: tests that take more than a few seconds",
]

# -----------------------------------------------------------------------------
# coverage — 80% per Task 5 requirement.
# -----------------------------------------------------------------------------

[tool.coverage.run]
branch = true
source = ["growlithe"]
omit = [
    "*/tests/*",
    "*/__main__.py",
    # service.py wires the long-lived process together: signal
    # handlers, the aiohttp health server, and the dependency
    # construction sequence. It is exercised end-to-end by the
    # integration test and the real-NCBI smoke test; unit-level
    # coverage would mock everything and prove nothing.
    "*/growlithe/service.py",
]

[tool.coverage.report]
show_missing = true
fail_under = 80
exclude_lines = [
    "pragma: no cover",
    "raise NotImplementedError",
    "if TYPE_CHECKING:",
    "\\.\\.\\.",
]

# -----------------------------------------------------------------------------
# mypy — strict, matching kanto-commons.
# -----------------------------------------------------------------------------

[tool.mypy]
python_version = "3.12"
strict = true
warn_unused_configs = true
warn_unused_ignores = true
warn_return_any = true
warn_unreachable = true
disallow_untyped_defs = true
disallow_incomplete_defs = true
no_implicit_optional = true
check_untyped_defs = true
strict_equality = true
extra_checks = true
show_error_codes = true
pretty = true
files = ["src/growlithe"]

[[tool.mypy.overrides]]
module = ["respx.*", "aiohttp.*"]
ignore_missing_imports = true
