# =============================================================================
# alakazam — the Scorer service.
# =============================================================================
#
# Consumes EmbeddingsReady events from kanto.embedded, queries Mew for the
# per-genome embedding's k nearest neighbors, computes a three-component
# novelty score (NN distance + coverage + Mahalanobis), persists it back to
# Mew, and emits IsolateScored to kanto.scored.
#
# Tiered scoring: NN distance is cheap and runs for every isolate; the
# expensive coverage and Mahalanobis components only run for the small slice
# whose NN distance exceeds the candidate threshold. See task-08 for the
# full design and Section 6 of the README for operational guidance.
# =============================================================================

[project]
name = "alakazam"
version = "0.1.0"
description = "Kanto Scorer: novelty scoring with multi-component Strategy pattern"
readme = "README.md"
requires-python = ">=3.12,<3.13"
license = { text = "Proprietary" }
authors = [{ name = "Varun Viswanathan" }]

dependencies = [
    "kanto-commons",

    # Numerical work for the scoring components: dot products against the
    # reference set (coverage), Mahalanobis denominator, vector ops.
    "numpy>=1.26,<3",

    # Reference set + per-protein embeddings live in Parquet on Object
    # Storage; pyarrow gives us a zero-copy reader.
    "pyarrow>=17.0,<22",

    # Health probes. Same minimal choice as the other consumers: not
    # worth a full ASGI framework for /healthz + /readyz.
    "aiohttp>=3.10,<4",

    # Retry helper for the few transient loops we own that the kanto-
    # commons wrappers don't already cover.
    "tenacity>=9.0,<10",
]

[dependency-groups]
dev = [
    "pytest>=8.3.0",
    "pytest-asyncio>=0.24.0",
    "pytest-cov>=5.0.0",
    "testcontainers[postgres]>=4.8.0",
    "mypy>=1.13.0",
    "kanto-migrations",
]

[tool.uv.sources]
kanto-commons = { workspace = true }
kanto-migrations = { workspace = true }

[build-system]
requires = ["hatchling"]
build-backend = "hatchling.build"

[tool.hatch.build.targets.wheel]
packages = ["src/alakazam"]

[project.scripts]
alakazam = "alakazam.__main__:main"
# Centroid recomputation job. Runs as the helm-shipped CronJob; also
# safe to invoke manually for ad-hoc recompute.
alakazam-centroids = "alakazam.scripts.species_centroids_job:main"
# One-shot ingest of a reference-protein FASTA bundle into the parquet
# blob the coverage strategy loads at startup. Operator-only.
alakazam-build-reference = "alakazam.scripts.build_reference_set:main"

# -----------------------------------------------------------------------------
# pytest
# -----------------------------------------------------------------------------

[tool.pytest.ini_options]
asyncio_mode = "auto"
testpaths = ["tests"]
markers = [
    "integration: tests that require external services (Docker, etc.)",
    "slow: tests that take more than a few seconds",
]

# -----------------------------------------------------------------------------
# coverage — 80% per task-08 §9.
# -----------------------------------------------------------------------------

[tool.coverage.run]
branch = true
source = ["alakazam"]
omit = [
    "*/tests/*",
    "*/__main__.py",
    # service.py wires signal handlers and the aiohttp health server.
    # Exercised end-to-end by integration tests; isolated unit coverage
    # would only mock the wiring.
    "*/alakazam/service.py",
    # The operator-facing scripts are exercised via their dry-run
    # paths; the full main() wiring is integration-tested.
    "*/alakazam/scripts/build_reference_set.py",
]

[tool.coverage.report]
show_missing = true
fail_under = 80
exclude_lines = [
    "pragma: no cover",
    "raise NotImplementedError",
    "if TYPE_CHECKING:",
    "\\.\\.\\.",
]

# -----------------------------------------------------------------------------
# mypy — strict, matching every other Kanto package.
# -----------------------------------------------------------------------------

[tool.mypy]
python_version = "3.12"
strict = true
warn_unused_configs = true
warn_unused_ignores = true
warn_return_any = true
warn_unreachable = true
disallow_untyped_defs = true
disallow_incomplete_defs = true
no_implicit_optional = true
check_untyped_defs = true
strict_equality = true
extra_checks = true
show_error_codes = true
pretty = true
files = ["src/alakazam"]

[[tool.mypy.overrides]]
module = ["aiohttp.*", "pyarrow.*"]
ignore_missing_imports = true
