# Defaults shared across environments. Each entry corresponds to a
# value the kanto-common library templates read; see
# infrastructure/helm/CONVENTIONS.md for the contract.

image:
  registry: ""              # ACR FQDN, e.g. kantodevacr.azurecr.io
  repository: kanto-alakazam
  tag: ""                   # MUST be a Git SHA in prod. `latest` is rejected.
  pullPolicy: IfNotPresent
  pullSecrets: []

workloadIdentity:
  enabled: true
  clientId: ""              # terraform output aks_workload_identity_client_id
  tenantId: ""              # AAD tenant ID

keyVault:
  name: ""                  # vault name (NOT URI), e.g. kanto-dev-kv-ab12cd
  tenantId: ""              # same as workloadIdentity.tenantId
  secrets:
    - objectName: ""        # set per-env (e.g. kanto-dev-mew-password)
      alias: mew-password
      envVar: KANTO_MEW_PASSWORD
    - objectName: ""        # set per-env (e.g. kanto-dev-eventhubs-connection)
      alias: eventhubs-connection
      envVar: KANTO_STREAMING_SASL_PASSWORD

otel:
  endpoint: "http://otel-collector.observability.svc.cluster.local:4318"
  sampleRate: 1.0
  protocol: "http/protobuf"

prometheus:
  scrape: true
  port: 9464
  path: "/metrics"

# Alakazam is CPU+memory shaped by the coverage matmul. ``medium``
# gives a quarter-core and half a gig — bump to ``large`` if you raise
# reference-set size or coverage_max_proteins.
resources:
  preset: "medium"
  overrides: {}

probes:
  port: 8081
  liveness:
    path: "/healthz"
    initialDelaySeconds: 15
    periodSeconds: 30
    timeoutSeconds: 5
    failureThreshold: 3
  readiness:
    path: "/readyz"
    initialDelaySeconds: 10
    periodSeconds: 10
    timeoutSeconds: 5
    failureThreshold: 3

networkPolicy:
  enabled: true
  allowFromPods: []
  allowToPods: []
  allowToCidrs: []
  # Mew private endpoint goes in values-{env}.yaml.

service:
  type: ClusterIP
  port: 8080                # unused — Alakazam has no inbound app traffic
  metricsPort: 9464

pod:
  annotations: {}
  labels: {}
  topologySpreadConstraints: []
  nodeSelector: {}
  tolerations: []
  affinity: {}

kanto:
  environment: "dev"
  logLevel: "INFO"
  logFormat: "json"

alakazam:
  # Horizontally scalable consumer. Three replicas in dev; production
  # scales with the embedded-topic partition count via values-prod.
  replicaCount: 3
  consumerGroup: "alakazam"

  # Tier-1 (NN distance) tuning.
  candidateThreshold: 0.30
  nnK: 10

  # Scoring weights. Starting values; Task 12 tunes properly.
  weightNn: 1.0
  weightCoverage: 2.0
  weightMahalanobis: 0.5

  # Tier-2 coverage tuning.
  referenceSetContainer: "kanto-metadata"
  referenceSetKey: "references/common_proteins_v1.parquet"
  coverageMatchThreshold: 0.70
  coverageMaxProteins: 20000

  # Tier-2 Mahalanobis tuning.
  mahalanobisMinSamples: 20
  mahalanobisRegularization: 0.0001

  # Alert flag.
  alertThreshold: 0.60

  # Centroid cache refresh in the running consumer.
  centroidRefreshSeconds: 3600

  # Centroid CronJob (operator-facing).
  centroidMinIsolates: 10
  centroidOrganismFilter: ""

  # Mew retry budget per write.
  mewMaxAttempts: 5

  runOnce: false

# Object Storage container names. Override per env.
objectStorage:
  accountUrl: ""
  proteinsContainer: "kanto-proteins"
  embeddingsContainer: "kanto-embeddings"
  metadataContainer: "kanto-metadata"

# Mew (Azure Postgres Flexible Server) connection details.
mew:
  host: ""
  port: 5432
  database: "kanto"
  user: "kanto_admin"
  sslmode: "verify-full"

# Event Hubs Kafka endpoint.
streaming:
  bootstrapServers: ""
  saslUsername: "$ConnectionString"
  embeddedTopic: "kanto.embedded"
  scoredTopic: "kanto.scored"

# Pod disruption budget — at least half the replicas survive any
# voluntary disruption (cordon/drain, node update).
pdb:
  enabled: true
  minAvailable: "50%"

# Species centroid CronJob. Disabled by default — flip on once Mew
# has enough embedded isolates for the math to be meaningful.
centroidCronJob:
  enabled: true
  # Daily at 03:00 UTC: low load on Mew (analyst dashboards are
  # quieter overnight) and well after the last batch of overnight
  # ingest from Growlithe/Snorlax.
  schedule: "0 3 * * *"
  concurrencyPolicy: Forbid
  successfulJobsHistoryLimit: 3
  failedJobsHistoryLimit: 3
  activeDeadlineSeconds: 14400   # 4h hard wall
  backoffLimit: 2
  resources:
    preset: "large"
    overrides: {}
