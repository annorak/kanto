# Prod environment overrides. Scale replicas to match the embedded-
# topic partition count; centroid job runs daily at 03:00 UTC.

image:
  registry: kantoprodacr.azurecr.io
  tag: "0000000000000000000000000000000000000000"

workloadIdentity:
  enabled: true
  clientId: "00000000-0000-0000-0000-000000000000"
  tenantId: "00000000-0000-0000-0000-000000000000"

keyVault:
  name: REPLACE_VIA_HELM_SET
  tenantId: "00000000-0000-0000-0000-000000000000"
  secrets:
    - objectName: REPLACE_VIA_HELM_SET
      alias: mew-password
      envVar: KANTO_MEW_PASSWORD
    - objectName: REPLACE_VIA_HELM_SET
      alias: eventhubs-connection
      envVar: KANTO_STREAMING_SASL_PASSWORD

mew:
  host: REPLACE_VIA_HELM_SET

objectStorage:
  accountUrl: https://REPLACE_VIA_HELM_SET.blob.core.windows.net
  proteinsContainer: kanto-proteins-prod
  embeddingsContainer: kanto-embeddings-prod
  metadataContainer: kanto-metadata-prod

streaming:
  bootstrapServers: REPLACE_VIA_HELM_SET.servicebus.windows.net:9093

kanto:
  environment: "prod"
  logLevel: "INFO"
  logFormat: "json"

resources:
  preset: "large"

networkPolicy:
  enabled: true
  allowToCidrs:
    - cidr: 10.10.0.0/16
      ports:
        - port: 5432
          protocol: TCP

alakazam:
  # Match the embedded-topic partition count in prod (8 in v1).
  replicaCount: 8
  # Production tightens the candidate threshold once Task 12 has
  # tuned a real value against historical data; the dev default
  # stands until then.
  candidateThreshold: 0.30
  alertThreshold: 0.60

centroidCronJob:
  enabled: true
  schedule: "0 3 * * *"
  resources:
    preset: "xlarge"
