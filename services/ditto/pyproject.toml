# =============================================================================
# ditto — the GPU embedder service (Modal-deployed).
# =============================================================================
#
# Consumes (accession, version, os_key) from Snorlax via a Modal function call.
# Pulls the protein FASTA from Azure Blob Storage, runs ESM C 600M forward
# passes in length-grouped batches, writes per-protein embeddings as Parquet
# back to Blob Storage, upserts the per-genome length-weighted-mean aggregate
# into Mew (pgvector), and emits EmbeddingsReady to kanto.embedded.
#
# This package is a workspace member like every other service. The Modal
# image is built from src/ — see modal_app.py for the @app.function declaration.
# =============================================================================

[project]
name = "ditto"
version = "0.1.0"
description = "Kanto Embedder: ESM C 600M protein embeddings on Modal GPUs"
readme = "README.md"
requires-python = ">=3.12,<3.13"
license = { text = "Proprietary" }
authors = [{ name = "Varun Viswanathan" }]

dependencies = [
    "kanto-commons",

    # Modal SDK — drives the function definition and the runtime.
    # Pin tightly; image-build and runtime quirks change between minor
    # releases and we don't want a `modal deploy` to silently pick up a
    # new image-builder version.
    "modal>=1.0,<2",

    # Parquet writer for per-protein embeddings.
    "pyarrow>=17.0,<22",

    # tenacity for the few transient-retry loops we own (the kanto-commons
    # storage and Mew wrappers already retry internally).
    "tenacity>=9.0,<10",

    # NumPy for the aggregate + parquet column construction. Already a
    # transitive of pyarrow; pinning here so type-checkers see it.
    "numpy>=1.26,<3",

    # Modal pulls in cbor2; cbor2 6.x added a Rust 2024-edition source
    # build that fails on the macOS x86_64 dev box's bundled cargo.
    # Constrain to the pure-Python branch so `uv sync` works on every
    # supported dev platform; cbor2 5.x is the production line and
    # has no breaking change for Modal's usage.
    "cbor2<6",
]

[project.optional-dependencies]
# torch + esm live here, NOT in `dependencies`, because:
#
# 1. Modal builds the image with explicit CUDA wheels (see
#    modal_app.py:_build_image) — the runtime never installs them via
#    this pyproject.
#
# 2. Local dev on a Mac x86_64 has no torch wheels available, so
#    treating them as required deps would break `uv sync` on every
#    operator's laptop.
#
# Install with `uv sync --extra gpu` on a Linux machine that has CUDA
# and on the rare occasion you need to run the benchmark locally.
gpu = [
    # Pinning is the §Common Pitfalls requirement — breaking changes to
    # the esm API are common. Verify `esm.models.esmc.ESMC` import path
    # against the version pinned here before bumping.
    "esm>=3.1,<4",
    "torch>=2.4,<3",
]

[dependency-groups]
dev = [
    "pytest>=8.3.0",
    "pytest-asyncio>=0.24.0",
    "pytest-cov>=5.0.0",
    "mypy>=1.13.0",
    "kanto-migrations",
]

[tool.uv.sources]
kanto-commons = { workspace = true }
kanto-migrations = { workspace = true }

[build-system]
requires = ["hatchling"]
build-backend = "hatchling.build"

[tool.hatch.build.targets.wheel]
packages = ["src/ditto"]

[project.scripts]
ditto-benchmark = "ditto.scripts.benchmark:main"
ditto-cost-monitor = "ditto.scripts.cost_monitor:main"

# -----------------------------------------------------------------------------
# pytest
# -----------------------------------------------------------------------------

[tool.pytest.ini_options]
asyncio_mode = "auto"
testpaths = ["tests"]
markers = [
    "integration: tests that require external services (Modal, real Azure, etc.)",
    "slow: tests that take more than a few seconds",
    "gpu: tests that require a CUDA device with ESM C weights present",
]

# -----------------------------------------------------------------------------
# coverage — 75% per task-07 §12 (lower than other services; GPU code is hard
# to fully cover with unit tests — integration coverage matters more here).
# -----------------------------------------------------------------------------

[tool.coverage.run]
branch = true
source = ["ditto"]
omit = [
    "*/tests/*",
    "*/modal_app.py",
    # model.py loads ESM C weights and runs CUDA forward passes; covered
    # by GPU-marked integration tests, not unit tests.
    "*/ditto/model.py",
    # scripts/ contains operator-run CLIs (benchmark + cost monitor);
    # tested via dry-run unit tests but the wiring is excluded.
    "*/ditto/scripts/*",
]

[tool.coverage.report]
show_missing = true
fail_under = 75
exclude_lines = [
    "pragma: no cover",
    "raise NotImplementedError",
    "if TYPE_CHECKING:",
    "\\.\\.\\.",
]

# -----------------------------------------------------------------------------
# mypy — strict, matches snorlax/growlithe/kanto-commons.
# -----------------------------------------------------------------------------

[tool.mypy]
python_version = "3.12"
strict = true
warn_unused_configs = true
warn_unused_ignores = true
warn_return_any = true
warn_unreachable = true
disallow_untyped_defs = true
disallow_incomplete_defs = true
no_implicit_optional = true
check_untyped_defs = true
strict_equality = true
extra_checks = true
show_error_codes = true
pretty = true
files = ["src/ditto"]

[[tool.mypy.overrides]]
module = ["modal.*", "esm.*", "torch.*", "pyarrow.*"]
ignore_missing_imports = true
