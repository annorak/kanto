# =============================================================================
# Kanto — repository root pyproject.toml
# =============================================================================
#
# This file is the root of a uv workspace. It does not declare a Python
# package itself; its only job is to coordinate the per-service and
# per-library packages that live under services/ and libs/.
#
# When a new package is added, it appears as a directory under services/
# or libs/ with its own pyproject.toml and is added to the [tool.uv.workspace]
# members list below.
# =============================================================================

[project]
name = "kanto"
version = "0.0.0"
description = "Real-time bacterial pathogen surveillance pipeline"
readme = "README.md"
requires-python = ">=3.12,<3.13"
license = { text = "Proprietary" }
authors = [{ name = "Varun Viswanathan" }]

# The root project intentionally has no runtime dependencies. All real
# dependencies live in workspace member packages.
dependencies = []

[dependency-groups]
# Tooling shared across all packages, installed automatically by `uv sync`.
dev = [
    "pre-commit>=3.7.0",
    "ruff>=0.7.4",
    "mypy>=1.13.0",
    "pytest>=8.3.0",
    "pytest-cov>=5.0.0",
]

# -----------------------------------------------------------------------------
# uv configuration
# -----------------------------------------------------------------------------

[tool.uv]
# Treat the root as a coordinator, not a publishable package.
package = false

[tool.uv.workspace]
# Member packages are added as services and libs come online. The
# anticipated members are:
#   libs/kanto-common
#   services/growlithe
#   services/snorlax
#   services/ditto
#   services/alakazam
#   services/chatot
# Until each directory has its own pyproject.toml the list stays empty
# so `uv sync` succeeds on the bare repository (bootstrap checklist
# test #3).
members = []
exclude = []

# -----------------------------------------------------------------------------
# ruff — lint and format
# -----------------------------------------------------------------------------

[tool.ruff]
line-length = 100
target-version = "py312"
src = ["libs", "services"]
extend-exclude = [
    ".venv",
    "build",
    "dist",
    "infrastructure/helm",
    "infrastructure/terraform",
]

[tool.ruff.lint]
select = [
    "E",    # pycodestyle errors
    "F",    # pyflakes
    "I",    # isort
    "N",    # pep8-naming
    "UP",   # pyupgrade
    "B",    # flake8-bugbear
    "C4",   # flake8-comprehensions
    "SIM",  # flake8-simplify
    "RUF",  # ruff-specific
]
# Docstring (D) rules deliberately disabled — too noisy for v1. Individual
# packages can re-enable them in their own pyproject.toml if desired.

[tool.ruff.lint.per-file-ignores]
# Test files routinely use bare asserts and don't need import-order strictness.
"tests/**/*.py" = ["S101", "S106", "ARG"]
"**/tests/**/*.py" = ["S101", "S106", "ARG"]

[tool.ruff.format]
# Defaults match Black; explicit settings below for clarity.
quote-style = "double"
indent-style = "space"
line-ending = "lf"

# -----------------------------------------------------------------------------
# mypy — strict mode at the repo level
# -----------------------------------------------------------------------------

[tool.mypy]
python_version = "3.12"
strict = true
warn_unused_configs = true
warn_redundant_casts = true
warn_unused_ignores = true
warn_return_any = true
warn_unreachable = true
disallow_untyped_defs = true
disallow_incomplete_defs = true
disallow_untyped_decorators = true
no_implicit_optional = true
check_untyped_defs = true
strict_equality = true
extra_checks = true
show_error_codes = true
pretty = true

# Ignore third-party packages without type stubs by default; per-package
# overrides in services/* can opt into stricter behaviour.
[[tool.mypy.overrides]]
module = ["tests.*"]
disallow_untyped_defs = false

# -----------------------------------------------------------------------------
# pytest
# -----------------------------------------------------------------------------

[tool.pytest.ini_options]
minversion = "8.0"
addopts = [
    "--strict-markers",
    "--strict-config",
    "-ra",
    "--cov-report=term-missing",
    "--cov-fail-under=70",
]
testpaths = ["tests", "services", "libs"]
python_files = ["test_*.py", "*_test.py"]
python_classes = ["Test*"]
python_functions = ["test_*"]
filterwarnings = [
    "error",
    "ignore::DeprecationWarning:google.*",
]
markers = [
    "integration: tests that require external services (skipped in unit runs)",
    "slow: tests that take more than a few seconds",
]

# -----------------------------------------------------------------------------
# coverage
# -----------------------------------------------------------------------------

[tool.coverage.run]
branch = true
source = ["libs", "services"]
omit = [
    "*/tests/*",
    "*/test_*.py",
    "*/__main__.py",
]

[tool.coverage.report]
show_missing = true
skip_covered = false
exclude_lines = [
    "pragma: no cover",
    "raise NotImplementedError",
    "if TYPE_CHECKING:",
    "\\.\\.\\.",
]
