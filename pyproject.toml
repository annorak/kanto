# =============================================================================
# Kanto — repository root pyproject.toml
# =============================================================================
#
# This file is the root of a uv workspace. It does not declare a Python
# package itself; its only job is to coordinate the per-service and
# per-library packages that live under services/ and libs/.
#
# When a new package is added, it appears as a directory under services/
# or libs/ with its own pyproject.toml and is added to the [tool.uv.workspace]
# members list below.
# =============================================================================

[project]
name = "kanto"
version = "0.0.0"
description = "Real-time bacterial pathogen surveillance pipeline"
readme = "README.md"
requires-python = ">=3.12,<3.13"
license = { text = "Proprietary" }
authors = [{ name = "Varun Viswanathan" }]

# The root project intentionally has no runtime dependencies. All real
# dependencies live in workspace member packages.
dependencies = []

[dependency-groups]
# Tooling shared across all packages, installed automatically by `uv sync`.
dev = [
    "pre-commit>=3.7.0",
    "ruff>=0.7.4",
    "mypy>=1.13.0",
    "pytest>=8.3.0",
    "pytest-cov>=5.0.0",
]

# -----------------------------------------------------------------------------
# uv configuration
# -----------------------------------------------------------------------------

[tool.uv]
# Treat the root as a coordinator, not a publishable package.
package = false

[tool.uv.workspace]
# Member packages are added as services and libs come online. The
# anticipated members are:
#   libs/kanto-commons              <- Task 1
#   infrastructure/migrations      <- Task 3
#   services/growlithe             <- Task 4
#   services/snorlax               <- Task 5
#   services/ditto                 <- Task 7 (Modal)
#   services/alakazam              <- Task 6
#   services/chatot                <- Task 8
members = [
    "libs/kanto-commons",
    "infrastructure/migrations",
    "services/growlithe",
    "services/snorlax",
]
exclude = []

# -----------------------------------------------------------------------------
# ruff — lint and format
# -----------------------------------------------------------------------------

[tool.ruff]
line-length = 100
target-version = "py312"
src = ["libs", "services"]
extend-exclude = [
    ".venv",
    "build",
    "dist",
    "infrastructure/helm",
    "infrastructure/terraform",
    "**/versions/*.py.mako",
]

[tool.ruff.lint]
select = [
    "E",    # pycodestyle errors
    "F",    # pyflakes
    "I",    # isort
    "N",    # pep8-naming
    "UP",   # pyupgrade
    "B",    # flake8-bugbear
    "C4",   # flake8-comprehensions
    "SIM",  # flake8-simplify
    "RUF",  # ruff-specific
]
# Docstring (D) rules deliberately disabled — too noisy for v1. Individual
# packages can re-enable them in their own pyproject.toml if desired.

[tool.ruff.lint.per-file-ignores]
# Test files routinely use bare asserts and don't need import-order strictness.
"tests/**/*.py" = ["S101", "S106", "ARG"]
"**/tests/**/*.py" = ["S101", "S106", "ARG"]

[tool.ruff.format]
# Defaults match Black; explicit settings below for clarity.
quote-style = "double"
indent-style = "space"
line-ending = "lf"

# -----------------------------------------------------------------------------
# mypy — strict mode at the repo level
# -----------------------------------------------------------------------------

[tool.mypy]
python_version = "3.12"
strict = true
warn_unused_configs = true
warn_redundant_casts = true
warn_unused_ignores = true
warn_return_any = true
warn_unreachable = true
disallow_untyped_defs = true
disallow_incomplete_defs = true
disallow_untyped_decorators = true
no_implicit_optional = true
check_untyped_defs = true
strict_equality = true
extra_checks = true
show_error_codes = true
pretty = true

# Tests have looser type-discipline defaults.
[[tool.mypy.overrides]]
module = ["tests.*"]
disallow_untyped_defs = false

# Third-party libraries without bundled type stubs. Listed at the
# repo root so that running mypy from the workspace top-level (which
# is what pre-commit and CI do) sees the same overrides as a local
# `mypy` invocation inside a single package.
[[tool.mypy.overrides]]
module = [
    "aiokafka.*",
    "azure.*",
    "pgvector.*",
    "testcontainers.*",
]
ignore_missing_imports = true

# -----------------------------------------------------------------------------
# pytest
# -----------------------------------------------------------------------------

[tool.pytest.ini_options]
minversion = "8.0"
addopts = [
    "--strict-markers",
    "--strict-config",
    "-ra",
    "--cov-report=term-missing",
    "--cov-fail-under=70",
]
# Each workspace member owns its own pytest config and runs its tests
# from its own working directory (CI does this; local devs follow the
# same convention). The root-level pytest invocation is reserved for
# the cross-cutting tests under ``tests/`` only — listing nested
# packages here causes ``tests.conftest`` collisions across packages.
testpaths = ["tests"]
python_files = ["test_*.py", "*_test.py"]
python_classes = ["Test*"]
python_functions = ["test_*"]
filterwarnings = [
    "error",
    "ignore::DeprecationWarning:google.*",
]
markers = [
    "integration: tests that require external services (skipped in unit runs)",
    "slow: tests that take more than a few seconds",
]

# -----------------------------------------------------------------------------
# coverage
# -----------------------------------------------------------------------------

[tool.coverage.run]
branch = true
# Each package enforces its own coverage gate via its own pyproject.
# The root-level coverage config is here for the future cross-cutting
# ``tests/`` directory only.
source = ["libs", "services"]
omit = [
    "*/tests/*",
    "*/test_*.py",
    "*/__main__.py",
]

[tool.coverage.report]
show_missing = true
skip_covered = false
exclude_lines = [
    "pragma: no cover",
    "raise NotImplementedError",
    "if TYPE_CHECKING:",
    "\\.\\.\\.",
]
