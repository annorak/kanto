# =============================================================================
# alembic.ini — Mew schema migration configuration
# =============================================================================
#
# Connection details are NOT configured here. ``env.py`` reads them from
# ``KANTO_MEW_*`` environment variables via ``kanto_commons.config``.
# Hard-coding a DSN into this file would defeat the entire point of
# using ``MewSettings`` as the single source of truth.
#
# Operators select the target environment by exporting the matching
# variable set (local ``.envrc``, dev Azure Key Vault, prod Azure Key
# Vault). See README.md for the full apply procedure.
# =============================================================================

[alembic]
# Resolve the migration tree relative to this ini file, not the caller's
# CWD, so ``alembic upgrade head`` works regardless of where it's run from.
script_location = %(here)s/src/kanto_migrations

# Filename convention: <YYYYMMDD>_<HHMM>_<short_imperative>.py.
# The numeric prefix is wall-clock; this gives lexical ordering that
# matches creation order without relying on Alembic's auto-incrementing
# revision IDs (which produce opaque hex names).
file_template = %%(year)d%%(month).2d%%(day).2d_%%(hour).2d%%(minute).2d_%%(slug)s

# Source paths that downgrade scripts can reference.
prepend_sys_path = .
# Use the OS-native path separator. Required since Alembic 1.18 to
# silence the legacy-splitting deprecation warning.
path_separator = os

# Use the host's local timezone for filename timestamps. ``UTC`` keeps
# ordering correct across contributors in different timezones.
timezone = UTC

# Truncate the ``slug`` portion of the filename so paths stay readable.
truncate_slug_length = 40

# Run a single transaction across all migrations applied in one
# ``upgrade`` invocation. Set per-migration in env.py if a migration
# needs out-of-transaction execution (e.g. CREATE INDEX CONCURRENTLY).
transaction_per_migration = false

# Bump on every reformat-the-world change so cached pre-commit hooks
# pick up the new template version.
revision_environment = false

# A migration is considered "applied" only after its commit lands. We
# do not allow stamp-without-execute except in the explicit operator
# bootstrap procedure documented in README.md.
sourceless = false

# Track the migration head in a dedicated table inside the ``public``
# schema (Postgres default). The table is created on first run; it
# survives downgrades.
version_table = kanto_alembic_version
version_table_schema = public

# Logging is configured by Alembic's defaults plus the structlog
# integration in env.py. The section below is the standard Alembic
# logging boilerplate, kept verbatim so operators recognise it.

[loggers]
keys = root,sqlalchemy,alembic

[handlers]
keys = console

[formatters]
keys = generic

[logger_root]
level = WARNING
handlers = console
qualname =

[logger_sqlalchemy]
level = WARNING
handlers =
qualname = sqlalchemy.engine

[logger_alembic]
level = INFO
handlers =
qualname = alembic

[handler_console]
class = StreamHandler
args = (sys.stderr,)
level = NOTSET
formatter = generic

[formatter_generic]
format = %(levelname)-5.5s [%(name)s] %(message)s
datefmt = %H:%M:%S
