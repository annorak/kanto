# =============================================================================
# kanto-migrations — Alembic schema migrations for Mew
# =============================================================================
#
# Migrations are infrastructure, not application code. They live here so
# that ownership is clear (operations team, not any single service) and so
# that downgrading one service's image cannot accidentally roll back a
# schema change other services depend on.
#
# This package owns the Alembic ``env.py``, the migration version files,
# and the integration tests that verify migrations apply cleanly against
# a fresh pgvector container.
# =============================================================================

[project]
name = "kanto-migrations"
version = "0.1.0"
description = "Alembic migrations for Mew (Postgres + pgvector)"
readme = "README.md"
requires-python = ">=3.12,<3.13"
license = { text = "Proprietary" }
authors = [{ name = "Varun Viswanathan" }]

dependencies = [
    "alembic>=1.13,<2",
    # Alembic uses SQLAlchemy for connection management even when
    # migration bodies are pure SQL. Pulled at the latest 2.x.
    "sqlalchemy>=2.0,<3",
    "psycopg[binary]>=3.2,<4",
    "kanto-commons",
]

[dependency-groups]
dev = [
    "pytest>=8.3.0",
    "pytest-asyncio>=0.24.0",
    "pytest-cov>=5.0.0",
    "testcontainers[postgres]>=4.8.0",
    "mypy>=1.13.0",
]

[build-system]
requires = ["hatchling"]
build-backend = "hatchling.build"

[tool.hatch.build.targets.wheel]
packages = ["src/kanto_migrations"]
include = ["src/kanto_migrations/py.typed"]

[tool.uv.sources]
kanto-commons = { workspace = true }

# -----------------------------------------------------------------------------
# pytest — package-local overrides on top of the repo-root config.
# -----------------------------------------------------------------------------

[tool.pytest.ini_options]
asyncio_mode = "auto"
testpaths = ["tests"]
addopts = [
    "--strict-markers",
    "--strict-config",
    "-ra",
    # Cover by path rather than module name. Alembic loads env.py and
    # the version files via ``importlib.util.spec_from_file_location``,
    # registering them as ``alembic.env``/``alembic.versions.*`` rather
    # than ``kanto_migrations.*``. Filename-based source matching picks
    # them up despite the rebranded module names.
    "--cov=src/kanto_migrations",
    "--cov-report=term-missing",
    "--cov-fail-under=90",
]

# -----------------------------------------------------------------------------
# coverage — Section 3 mandates ≥90% on migration logic.
# -----------------------------------------------------------------------------

[tool.coverage.run]
branch = true
source = ["kanto_migrations"]
omit = [
    "*/tests/*",
    "*/script.py.mako",
]

[tool.coverage.report]
show_missing = true
fail_under = 90
exclude_lines = [
    "pragma: no cover",
    "raise NotImplementedError",
    "if TYPE_CHECKING:",
    "\\.\\.\\.",
]

# -----------------------------------------------------------------------------
# mypy — strict, plus stubs for libs without type info.
# -----------------------------------------------------------------------------

[tool.mypy]
python_version = "3.12"
strict = true
files = ["src/kanto_migrations"]

[[tool.mypy.overrides]]
module = ["alembic.*", "testcontainers.*", "pgvector.*"]
ignore_missing_imports = true
