apiVersion: v2
name: consumer-chart
description: |
  Test fixture that imports kanto-common and renders every helper it
  exposes. Used by CI (helm template + kubeconform) to assert the
  library's output is valid Kubernetes YAML.

  Not a deployable chart. Kept under tests/fixtures so it ships with
  the library chart's test harness but is excluded from the published
  artifact via .helmignore.
type: application
version: 0.0.0
appVersion: "0.0.0"
kubeVersion: ">=1.30.0-0"
dependencies:
  - name: kanto-common
    version: ">=0.1.0"
    repository: "file://../../.."
