{{- if .Values.otelCollector.enabled }}
apiVersion: v1
kind: ConfigMap
metadata:
  name: otel-collector-config
  namespace: observability
  labels:
    {{- include "bootstrap.commonLabels" . | nindent 4 }}
data:
  config.yaml: |
    extensions:
      # /health (port 13133) backs the pod liveness probe.
      health_check:
        endpoint: 0.0.0.0:13133
      # / on port 8888 surfaces collector metrics; declared here so
      # it shows up in the components map even though Prometheus
      # scrape happens on 8888 directly.

    receivers:
      otlp:
        protocols:
          grpc:
            endpoint: 0.0.0.0:4317
          http:
            endpoint: 0.0.0.0:4318

    processors:
      batch:
        timeout: 5s
        send_batch_size: 1024
      memory_limiter:
        check_interval: 1s
        limit_percentage: 80
        spike_limit_percentage: 25
      resource:
        attributes:
          - key: deployment.environment
            value: {{ .Values.environment }}
            action: upsert
          - key: k8s.cluster.name
            value: {{ .Values.clusterName }}
            action: upsert
      k8sattributes:
        auth_type: serviceAccount
        passthrough: false
        extract:
          metadata:
            - k8s.pod.name
            - k8s.pod.uid
            - k8s.deployment.name
            - k8s.namespace.name
            - k8s.node.name
            - k8s.pod.start_time
        pod_association:
          - sources:
              - from: resource_attribute
                name: k8s.pod.ip
          - sources:
              - from: connection

    exporters:
{{- if .Values.otelCollector.debugExporter }}
      debug:
        verbosity: basic
        sampling_initial: 5
        sampling_thereafter: 200
{{- end }}
{{- if .Values.otelCollector.applicationInsightsConnectionString }}
      azuremonitor:
        connection_string: ${env:APPLICATIONINSIGHTS_CONNECTION_STRING}
{{- end }}

    service:
      extensions: [health_check]
      pipelines:
        traces:
          receivers: [otlp]
          processors: [memory_limiter, k8sattributes, resource, batch]
          exporters:
{{- if .Values.otelCollector.debugExporter }}
            - debug
{{- end }}
{{- if .Values.otelCollector.applicationInsightsConnectionString }}
            - azuremonitor
{{- end }}
        metrics:
          receivers: [otlp]
          processors: [memory_limiter, resource, batch]
          exporters:
{{- if .Values.otelCollector.debugExporter }}
            - debug
{{- end }}
{{- if .Values.otelCollector.applicationInsightsConnectionString }}
            - azuremonitor
{{- end }}
        logs:
          receivers: [otlp]
          processors: [memory_limiter, resource, batch]
          exporters:
{{- if .Values.otelCollector.debugExporter }}
            - debug
{{- end }}
{{- if .Values.otelCollector.applicationInsightsConnectionString }}
            - azuremonitor
{{- end }}
      telemetry:
        metrics:
          level: basic
{{- end }}
